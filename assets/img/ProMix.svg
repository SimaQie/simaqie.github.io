<svg xmlns="http://www.w3.org/2000/svg" width="540" height="246" viewBox="0 0 540 246" role="img" aria-labelledby="title desc">
  <title id="title">ProMix research overview</title>
  <desc id="desc">Multiple robot data domains feed a proxy and reference model, which learn mixture weights for final VLA training.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#f4f7fd"/>
      <stop offset="1" stop-color="#eef8f5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#43617f"/>
    </marker>
  </defs>
  <rect width="540" height="246" rx="16" fill="url(#background)"/>
  <text x="24" y="40" fill="#173b63" font-family="Arial, sans-serif" font-size="27" font-weight="700">ProMix</text>
  <text x="25" y="62" fill="#536a7b" font-family="Arial, sans-serif" font-size="12">DATA MIXTURE OPTIMIZATION</text>
  <rect x="24" y="91" width="116" height="119" rx="12" fill="#fff" stroke="#cbd7e4" stroke-width="2"/>
  <rect x="41" y="108" width="80" height="17" rx="5" fill="#d6e2f2"/>
  <rect x="41" y="134" width="80" height="17" rx="5" fill="#c7e9de"/>
  <rect x="41" y="160" width="80" height="17" rx="5" fill="#f3dcc8"/>
  <text x="82" y="197" text-anchor="middle" fill="#38516c" font-family="Arial, sans-serif" font-size="14" font-weight="600">Domains</text>
  <path d="M146 150h25" fill="none" stroke="#43617f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="178" y="91" width="148" height="119" rx="12" fill="#fff" stroke="#b5cde1" stroke-width="2"/>
  <rect x="190" y="105" width="124" height="36" rx="7" fill="#deebf8"/>
  <rect x="190" y="150" width="124" height="36" rx="7" fill="#e2f3ec"/>
  <text x="252" y="128" text-anchor="middle" fill="#174b78" font-family="Arial, sans-serif" font-size="15" font-weight="600">Reference</text>
  <text x="252" y="173" text-anchor="middle" fill="#1e7666" font-family="Arial, sans-serif" font-size="15" font-weight="600">Proxy</text>
  <path d="M332 150h25" fill="none" stroke="#43617f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="364" y="91" width="152" height="119" rx="12" fill="#fff" stroke="#e5c9aa" stroke-width="2"/>
  <rect x="387" y="130" width="16" height="30" rx="3" fill="#e68d50"/>
  <rect x="412" y="112" width="16" height="48" rx="3" fill="#e68d50"/>
  <rect x="437" y="121" width="16" height="39" rx="3" fill="#e68d50"/>
  <rect x="462" y="102" width="16" height="58" rx="3" fill="#e68d50"/>
  <text x="440" y="183" text-anchor="middle" fill="#80512e" font-family="Arial, sans-serif" font-size="14" font-weight="600">VLA mixture</text>
</svg>
