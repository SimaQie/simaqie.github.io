<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI for Science: a feedback loop</title>
  <desc id="desc">A stylized scientific AI core connected to modeling, simulation, experiment, and validation.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#071b3a"/>
      <stop offset=".55" stop-color="#153b65"/>
      <stop offset="1" stop-color="#38245f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#5de5d0" stop-opacity=".3"/>
      <stop offset="1" stop-color="#5de5d0" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#7fe9dc" stroke-width="1.7"/>
    </marker>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020b1b" flood-opacity=".4"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="610" cy="338" r="300" fill="url(#glow)"/>
  <g opacity=".11" stroke="#a7dcff" stroke-width="1">
    <path d="M0 120H1200M0 220H1200M0 320H1200M0 420H1200M0 520H1200M110 0V675M310 0V675M510 0V675M710 0V675M910 0V675M1110 0V675"/>
  </g>
  <text x="70" y="92" fill="#b9d3ef" font-family="Arial, sans-serif" font-size="29" font-weight="700" letter-spacing="6">EXPLORING THE FRONTIERS</text>
  <text x="70" y="160" fill="#ffffff" font-family="Arial, sans-serif" font-size="65" font-weight="700">AI for Science</text>
  <text x="72" y="207" fill="#b9d3ef" font-family="Arial, sans-serif" font-size="27">From reasoning to real-world validation</text>
  <g fill="none" stroke="#7fe9dc" stroke-width="5" marker-end="url(#arrow)" opacity=".9">
    <path d="M420 352C455 280 520 250 577 250"/>
    <path d="M682 250C758 258 800 294 823 352"/>
    <path d="M818 454C774 511 710 528 663 528"/>
    <path d="M550 528C486 515 440 477 413 430"/>
  </g>
  <g filter="url(#shadow)" font-family="Arial, sans-serif" text-anchor="middle">
    <g><rect x="292" y="310" width="150" height="90" rx="18" fill="#152f59" stroke="#8fb7f6" stroke-width="2"/><text x="367" y="365" font-size="24" font-weight="700" fill="#fff">MODEL</text></g>
    <g><rect x="525" y="220" width="160" height="90" rx="18" fill="#153f5d" stroke="#7fe9dc" stroke-width="2"/><text x="605" y="275" font-size="23" font-weight="700" fill="#fff">SIMULATE</text></g>
    <g><rect x="790" y="355" width="190" height="90" rx="18" fill="#4c315f" stroke="#dfa8f4" stroke-width="2"/><text x="885" y="410" font-size="23" font-weight="700" fill="#fff">EXPERIMENT</text></g>
    <g><rect x="525" y="485" width="165" height="90" rx="18" fill="#25445a" stroke="#f8ca8d" stroke-width="2"/><text x="608" y="540" font-size="23" font-weight="700" fill="#fff">VALIDATE</text></g>
  </g>
  <g fill="#a9d8ea" opacity=".72"><circle cx="1060" cy="136" r="5"/><circle cx="1091" cy="162" r="3"/><circle cx="95" cy="546" r="4"/><circle cx="135" cy="575" r="3"/></g>
  <text x="70" y="622" fill="#d2e6f1" font-family="Arial, sans-serif" font-size="25" letter-spacing="2">REASONING  /  FEEDBACK  /  DISCOVERY</text>
</svg>
